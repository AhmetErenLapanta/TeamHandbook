global:
  scrape_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: teamhandbook-orchestrator
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["orchestrator:8080"]

# The alerts are in rules.yml and show on this server's Alerts page; add an alerting block here, with
# an Alertmanager, to have them sent.
