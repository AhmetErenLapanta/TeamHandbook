<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     role="img" aria-labelledby="t d"
     font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">One person approves it, and the rest of the team has it next session</title>
  <desc id="d">One thing, approved once, on five machines. On the left, one member of the team
    holding the thing they approved, drawn as a small card. An arrow labelled approves carries it
    into a single repository in the middle, where the same card sits. From there four arrows fan
    out to four teammates on the right, and each of them has that same card at their next session,
    with nothing to install.</desc>

  <!-- No <style> element and no prefers-color-scheme query, for the reason the loop diagram
       beside this one records: GitHub's page theme comes from the site's own settings, while an
       SVG loaded through <img> resolves prefers-color-scheme against the browser, so the two
       disagree for anyone reading a dark page on a light-preference machine. One neutral palette,
       no theme query, nothing to get out of step.

       Contrast, measured (WCAG, sRGB). Both backdrops that actually occur are given: the bare
       GitHub page, and the card fill composited over it, which is what the text inside a box
       really sits on and is about 0.2 lower.

                              light page   dark page   light card   dark card
         text     #77797d        4.36         4.34        4.17         4.09
         lines,
         icons    #818790        3.62         5.23        3.46         4.93
         card     #2f81f7        3.75         5.05        3.58         4.76

       #818790 and #2f81f7 are never text. They draw the arrows, the figures and the card, which
       WCAG 1.4.11 holds to 3:1, and both clear it on all four backdrops.

       #77797d is the only text colour, and the honest reading of it has two halves.
       At the embedded 880px width every string here is 22px or 19px, all of it weight 700,
       so all of it is large-scale text under 1.4.3, whose threshold is 3:1, and 4.09 is a pass
       with room. In a narrow container it is not: this file is embedded at width="880" with an
       <img>, so a 360px phone scales it to about 41% and 19px bold renders near 7.8px. At that
       rendered size the large-text exemption no longer applies, the threshold is 4.5:1, and the
       same 4.09 is a measured shortfall rather than a pass. No single grey can close that gap:
       a colour needs relative luminance below 0.1833 to reach 4.5:1 on #ffffff and above 0.1996
       to reach it on #0d1117, so the best a single value can do across both pages is 4.35:1.
       Hierarchy here is size and weight only; a dimmer second grey would trade a real shortfall
       for a worse one. -->

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0.5 L8.5 4.5 L0 8.5 Z" fill="#818790"/>
    </marker>
  </defs>

  <!-- The whole picture is one asymmetry: the same card, once on the left and four times on the
       right. That is the claim the product makes and it is drawn rather than written, which is
       why the card glyph is identical in all six places and is the only thing wearing the accent
       colour. Nothing is crossed out and nothing is compared: the fan is the argument. -->

  <!-- ── one person ──────────────────────────────────────────────────────── -->

  <rect x="28" y="81" width="160" height="140" rx="10" fill="#8b949e" fill-opacity=".05" stroke="#818790"/>

  <rect x="90" y="95" width="36" height="26" rx="4" fill="none" stroke="#2f81f7" stroke-width="2"/>
  <path d="M97 104 h18 M97 112 h12" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round"/>

  <circle cx="108" cy="143" r="9.5" fill="none" stroke="#818790" stroke-width="2"/>
  <path d="M93 173 a15 15 0 0 1 30 0" fill="none" stroke="#818790" stroke-width="2"/>

  <text x="108" y="204" font-size="22" font-weight="700" text-anchor="middle" fill="#77797d">One of you</text>

  <path d="M188 151 H296" fill="none" stroke="#818790" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="242" y="139" font-size="19" font-weight="700" text-anchor="middle" fill="#77797d">approves</text>

  <!-- ── one repository ──────────────────────────────────────────────────── -->

  <rect x="300" y="81" width="200" height="140" rx="10" fill="#8b949e" fill-opacity=".05" stroke="#818790"/>

  <rect x="382" y="121" width="36" height="26" rx="4" fill="none" stroke="#2f81f7" stroke-width="2"/>
  <path d="M389 130 h18 M389 138 h12" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round"/>

  <text x="400" y="204" font-size="22" font-weight="700" text-anchor="middle" fill="#77797d">One repository</text>

  <!-- ── everyone else ───────────────────────────────────────────────────── -->

  <path d="M500 151 C 552 151 588 58 640 58" fill="none" stroke="#818790" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M500 151 C 552 151 588 120 640 120" fill="none" stroke="#818790" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M500 151 C 552 151 588 182 640 182" fill="none" stroke="#818790" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M500 151 C 552 151 588 244 640 244" fill="none" stroke="#818790" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="752" y="20" font-size="22" font-weight="700" text-anchor="middle" fill="#77797d">Their next session</text>

  <rect x="648" y="34" width="208" height="48" rx="10" fill="#8b949e" fill-opacity=".05" stroke="#818790"/>
  <circle cx="728" cy="53" r="7.5" fill="none" stroke="#818790" stroke-width="1.8"/>
  <path d="M717 74 a11 11 0 0 1 22 0" fill="none" stroke="#818790" stroke-width="1.8"/>
  <rect x="750" y="45" width="36" height="26" rx="4" fill="none" stroke="#2f81f7" stroke-width="2"/>
  <path d="M757 54 h18 M757 62 h12" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round"/>

  <rect x="648" y="96" width="208" height="48" rx="10" fill="#8b949e" fill-opacity=".05" stroke="#818790"/>
  <circle cx="728" cy="115" r="7.5" fill="none" stroke="#818790" stroke-width="1.8"/>
  <path d="M717 136 a11 11 0 0 1 22 0" fill="none" stroke="#818790" stroke-width="1.8"/>
  <rect x="750" y="107" width="36" height="26" rx="4" fill="none" stroke="#2f81f7" stroke-width="2"/>
  <path d="M757 116 h18 M757 124 h12" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round"/>

  <rect x="648" y="158" width="208" height="48" rx="10" fill="#8b949e" fill-opacity=".05" stroke="#818790"/>
  <circle cx="728" cy="177" r="7.5" fill="none" stroke="#818790" stroke-width="1.8"/>
  <path d="M717 198 a11 11 0 0 1 22 0" fill="none" stroke="#818790" stroke-width="1.8"/>
  <rect x="750" y="169" width="36" height="26" rx="4" fill="none" stroke="#2f81f7" stroke-width="2"/>
  <path d="M757 178 h18 M757 186 h12" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round"/>

  <rect x="648" y="220" width="208" height="48" rx="10" fill="#8b949e" fill-opacity=".05" stroke="#818790"/>
  <circle cx="728" cy="239" r="7.5" fill="none" stroke="#818790" stroke-width="1.8"/>
  <path d="M717 260 a11 11 0 0 1 22 0" fill="none" stroke="#818790" stroke-width="1.8"/>
  <rect x="750" y="231" width="36" height="26" rx="4" fill="none" stroke="#2f81f7" stroke-width="2"/>
  <path d="M757 240 h18 M757 248 h12" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round"/>

  <text x="752" y="290" font-size="19" font-weight="700" text-anchor="middle" fill="#77797d">nothing to install</text>
</svg>
