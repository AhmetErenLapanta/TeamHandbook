<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250"
     role="img" aria-labelledby="t d"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="t">A skill, an MCP server, or a command, approved once, reaches the whole team</title>
  <desc id="d">A skill, an MCP server, or a command that is already on your machine, drawn as three
    boxes above a single figure who approves one of them. A line carries that approval down into
    one repository. From there, lines fan out to four teammates, and each of them has it at their
    next session, with nothing to install by hand.</desc>

  <!-- No <style> element and no prefers-color-scheme query, for the same reason the sibling
       diagrams record: GitHub's page theme comes from the site's own settings, while an SVG
       loaded through <img> resolves prefers-color-scheme against the browser instead, so the two
       disagree for anyone reading a dark page on a light-preference machine. One neutral palette,
       no theme query, nothing to get out of step.

       Box fills are transparent (fill="none"), so the only backdrop that ever occurs behind them
       is the page itself - there is no card fill to measure separately here.

       Contrast, measured (WCAG, sRGB), against both backdrops that actually occur:

                                  light page (#ffffff)   dark page (#0d1117)
         text and lines #77797d          4.36                    4.34
         accent, you and icons #1f6feb   4.63                    4.08
         box edge #7d8590                3.73                    5.07

       #1f6feb and #7d8590 are never text - they draw the person, the three icons and the box
       outlines - and WCAG 1.4.11 holds a meaningful graphic to 3:1; every ratio above clears it.

       #77797d is the only text colour (the three box labels and the three narrative phrases), and
       none of that text is large-scale under WCAG 1.4.3: every string here is 12px at weight 600
       or 700, short of the 18px-normal or 14px-bold threshold that exemption needs. So the 4.5:1
       AA ratio for normal text is what applies, not 3:1, and 4.36 on the light page and 4.34 on
       the dark one both fall short of it - a measured shortfall rather than a pass, the same
       honest reading the loop diagram beside this one gives its own text colour. -->

  <!-- ── what you already have ───────────────────────────────────────────── -->

  <rect x="199" y="8" width="150" height="36" rx="7" fill="none" stroke="#7d8590"/>
  <path d="M209 18 H215 L219 22 V34 H209 Z" fill="none" stroke="#1f6feb" stroke-width="1.4"/>
  <path d="M215 18 V22 H219" fill="none" stroke="#1f6feb" stroke-width="1.4"/>
  <path d="M211 26 H216 M211 30 H214" fill="none" stroke="#1f6feb" stroke-width="1.4" stroke-linecap="round"/>
  <text x="248" y="30" font-size="12" font-weight="600" fill="#77797d">skill</text>

  <rect x="365" y="8" width="150" height="36" rx="7" fill="none" stroke="#7d8590"/>
  <path d="M379 22 V17 M383 22 V17" fill="none" stroke="#1f6feb" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="376" y="22" width="10" height="8" rx="1.5" fill="none" stroke="#1f6feb" stroke-width="1.4"/>
  <path d="M377 30 Q 381 35 387 32" fill="none" stroke="#1f6feb" stroke-width="1.4" stroke-linecap="round"/>
  <text x="407" y="30" font-size="12" font-weight="600" fill="#77797d">MCP server</text>

  <rect x="531" y="8" width="150" height="36" rx="7" fill="none" stroke="#7d8590"/>
  <rect x="540" y="18" width="16" height="16" rx="2" fill="none" stroke="#1f6feb" stroke-width="1.4"/>
  <path d="M544 22 L548 26 L544 30" fill="none" stroke="#1f6feb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M549 30 H553" fill="none" stroke="#1f6feb" stroke-width="1.4" stroke-linecap="round"/>
  <text x="577" y="30" font-size="12" font-weight="600" fill="#77797d">command</text>

  <!-- ── you approve one ─────────────────────────────────────────────────── -->

  <path d="M274 44 L426 68" fill="none" stroke="#77797d" stroke-width="1.4"/>
  <path d="M440 44 L440 68" fill="none" stroke="#77797d" stroke-width="1.4"/>
  <path d="M606 44 L454 68" fill="none" stroke="#77797d" stroke-width="1.4"/>

  <circle cx="440" cy="88" r="19" fill="none" stroke="#1f6feb" stroke-width="1.4"/>
  <circle cx="440" cy="82" r="6.5" fill="none" stroke="#1f6feb" stroke-width="1.4"/>
  <path d="M430 103 a10 10 0 0 1 20 0" fill="none" stroke="#1f6feb" stroke-width="1.4"/>

  <text x="440" y="126" font-size="12" font-weight="700" text-anchor="middle" fill="#77797d">you approve once</text>
  <path d="M440 134 V148" fill="none" stroke="#77797d" stroke-width="1.4"/>

  <!-- ── one repository ──────────────────────────────────────────────────── -->

  <rect x="332" y="150" width="216" height="34" rx="8" fill="none" stroke="#7d8590"/>
  <text x="440" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="#77797d">one repository</text>

  <!-- ── everyone, next session ──────────────────────────────────────────── -->

  <path d="M368 184 L230 202" fill="none" stroke="#77797d" stroke-width="1.4"/>
  <path d="M404 184 L370 202" fill="none" stroke="#77797d" stroke-width="1.4"/>
  <path d="M476 184 L510 202" fill="none" stroke="#77797d" stroke-width="1.4"/>
  <path d="M512 184 L650 202" fill="none" stroke="#77797d" stroke-width="1.4"/>

  <circle cx="230" cy="208" r="6" fill="none" stroke="#77797d" stroke-width="1.4"/>
  <path d="M220.5 227 a9.5 9.5 0 0 1 19 0" fill="none" stroke="#77797d" stroke-width="1.4"/>

  <circle cx="370" cy="208" r="6" fill="none" stroke="#77797d" stroke-width="1.4"/>
  <path d="M360.5 227 a9.5 9.5 0 0 1 19 0" fill="none" stroke="#77797d" stroke-width="1.4"/>

  <circle cx="510" cy="208" r="6" fill="none" stroke="#77797d" stroke-width="1.4"/>
  <path d="M500.5 227 a9.5 9.5 0 0 1 19 0" fill="none" stroke="#77797d" stroke-width="1.4"/>

  <circle cx="650" cy="208" r="6" fill="none" stroke="#77797d" stroke-width="1.4"/>
  <path d="M640.5 227 a9.5 9.5 0 0 1 19 0" fill="none" stroke="#77797d" stroke-width="1.4"/>

  <text x="440" y="244" font-size="12" font-weight="700" text-anchor="middle" fill="#77797d">everyone, next session</text>
</svg>
