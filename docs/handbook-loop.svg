<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 524" width="880" height="524"
     role="img" aria-labelledby="t d"
     font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">The TeamHandbook loop</title>
  <desc id="d">A coding session produces evidence and a redacted transcript slice. One harvest call
    extracts up to three lessons, each scored out of ten; anything under the floor of 4 is dropped before
    you see it. At the next session start you choose: keep it personally, keep it in the project, or share
    it with the team as a pull request. Every skill carries its receipt, and the next session starts with
    it already loaded.</desc>

  <style>
    svg {
      --fg: #1f2328;
      --muted: #59636e;
      --line: #d1d9e0;
      --card: #ffffff;
      --accent: #0969da;
      --accent-soft: #ddf4ff;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --fg: #e6edf3;
        --muted: #9198a1;
        --line: #3d444d;
        --card: #151b23;
        --accent: #4493f8;
        --accent-soft: #121d2f;
      }
    }
    .card  { fill: var(--card); stroke: var(--line); fill-opacity: 1; stroke-opacity: 1; }
    .chip  { fill: var(--accent-soft); stroke: var(--accent); fill-opacity: 1; stroke-opacity: .45; }
    .h     { fill: var(--fg); }
    .m     { fill: var(--muted); }
    .a     { fill: var(--accent); }
    .ln    { stroke: var(--line); }
    .al    { stroke: var(--accent); }
    .ah    { fill: var(--muted); }
    .aha   { fill: var(--accent); }
    .mono  { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  </style>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" class="ah" fill="#79818b"/>
    </marker>
    <marker id="ara" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" class="aha" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- ── band 1: capture ─────────────────────────────────────────────────── -->

  <rect class="card" x="60"  y="52" width="240" height="86" rx="10" fill="#8b949e" fill-opacity=".10" stroke="#8b949e" stroke-opacity=".55"/>
  <text class="h" x="80" y="82"  font-size="14" font-weight="600" fill="#6e7681">Your session</text>
  <text class="m" x="80" y="103" font-size="11.5" fill="#79818b">commands, edits, errors — and the</text>
  <text class="m" x="80" y="119" font-size="11.5" fill="#79818b">rules you state out loud</text>

  <rect class="card" x="335" y="52" width="240" height="86" rx="10" fill="#8b949e" fill-opacity=".10" stroke="#8b949e" stroke-opacity=".55"/>
  <text class="h" x="355" y="82"  font-size="14" font-weight="600" fill="#6e7681">Evidence + transcript</text>
  <text class="m" x="355" y="103" font-size="11.5" fill="#79818b">error→fix pairs, teachings flagged</text>
  <text class="m" x="355" y="119" font-size="11.5" fill="#79818b">verbatim, secrets redacted</text>

  <rect class="chip" x="610" y="52" width="240" height="86" rx="10" fill="#3b82f6" fill-opacity=".08" stroke="#3b82f6" stroke-opacity=".45"/>
  <text class="h" x="630" y="82"  font-size="14" font-weight="600" fill="#6e7681">One harvest call</text>
  <text class="m" x="630" y="103" font-size="11.5" fill="#79818b">your own claude CLI, once per</text>
  <text class="m" x="630" y="119" font-size="11.5" fill="#79818b">session. Not a step sooner.</text>

  <path class="ln" d="M306 95 H329"  fill="none" stroke="#79818b" stroke-width="1.5" marker-end="url(#ar)"/>
  <path class="ln" d="M581 95 H604"  fill="none" stroke="#79818b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- harvest → the scored lessons -->
  <path class="al" d="M730 138 V156 H455 V168" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ara)"/>

  <!-- ── band 2: the scored lessons and the floor ────────────────────────── -->

  <rect class="card" x="60" y="176" width="790" height="132" rx="10" fill="#8b949e" fill-opacity=".10" stroke="#8b949e" stroke-opacity=".55"/>
  <text class="h" x="78" y="199" font-size="13" font-weight="600" fill="#6e7681">Up to 3 lessons, scored on 5 criteria</text>

  <g>
    <rect class="chip" x="78" y="210" width="236" height="48" rx="8" fill="#3b82f6" fill-opacity=".08" stroke="#3b82f6" stroke-opacity=".45"/>
    <text class="a" x="92" y="232" font-size="12" font-weight="600" fill="#3b82f6">correction</text>
    <text class="m" x="92" y="248" font-size="10.5" fill="#79818b">quotes your own words</text>
    <rect class="al" x="244" y="216" width="56" height="20" rx="10" fill="none" stroke="#3b82f6" stroke-opacity=".55"/>
    <text class="a" x="272" y="230" font-size="11" font-weight="600" text-anchor="middle" fill="#3b82f6">9/10</text>
  </g>
  <g>
    <rect class="chip" x="334" y="210" width="236" height="48" rx="8" fill="#3b82f6" fill-opacity=".08" stroke="#3b82f6" stroke-opacity=".45"/>
    <text class="a" x="348" y="232" font-size="12" font-weight="600" fill="#3b82f6">procedure</text>
    <text class="m" x="348" y="248" font-size="10.5" fill="#79818b">the steps that actually worked</text>
    <rect class="al" x="500" y="216" width="56" height="20" rx="10" fill="none" stroke="#3b82f6" stroke-opacity=".55"/>
    <text class="a" x="528" y="230" font-size="11" font-weight="600" text-anchor="middle" fill="#3b82f6">7/10</text>
  </g>
  <g>
    <rect class="chip" x="590" y="210" width="236" height="48" rx="8" fill="#3b82f6" fill-opacity=".08" stroke="#3b82f6" stroke-opacity=".45"/>
    <text class="a" x="604" y="232" font-size="12" font-weight="600" fill="#3b82f6">discovery</text>
    <text class="m" x="604" y="248" font-size="10.5" fill="#79818b">the trap this repo sets</text>
    <rect class="al" x="756" y="216" width="56" height="20" rx="10" fill="none" stroke="#3b82f6" stroke-opacity=".55"/>
    <text class="a" x="784" y="230" font-size="11" font-weight="600" text-anchor="middle" fill="#3b82f6">5/10</text>
  </g>

  <path class="al" d="M78 275 H762" fill="none" stroke="#3b82f6" stroke-opacity=".5" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="a" x="832" y="279" font-size="10.5" font-weight="600" text-anchor="end" fill="#3b82f6">floor 4/10</text>
  <text class="m" x="78" y="296" font-size="10.5" fill="#79818b">× error-fix 3/10 — under the floor, dropped before you ever see it</text>

  <!-- ── band 3: activation — you decide ─────────────────────────────────── -->

  <path class="ln" d="M455 308 V334" fill="none" stroke="#79818b" stroke-width="1.5"/>
  <text class="h" x="470" y="326" font-size="11.5" font-weight="600" fill="#6e7681">next session asks: keep, share, or skip</text>
  <path class="ln" d="M180 334 H730" fill="none" stroke="#79818b" stroke-width="1.5"/>
  <path class="ln" d="M180 334 V342" fill="none" stroke="#79818b" stroke-width="1.5" marker-end="url(#ar)"/>
  <path class="ln" d="M455 334 V342" fill="none" stroke="#79818b" stroke-width="1.5" marker-end="url(#ar)"/>
  <path class="ln" d="M730 334 V342" fill="none" stroke="#79818b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect class="card" x="60"  y="350" width="240" height="76" rx="10" fill="#8b949e" fill-opacity=".10" stroke="#8b949e" stroke-opacity=".55"/>
  <text class="h" x="80" y="375" font-size="13" font-weight="600" fill="#6e7681">Keep — personal</text>
  <text class="a mono" x="80" y="393" font-size="11" fill="#3b82f6">~/.claude/skills</text>
  <text class="m" x="80" y="410" font-size="10.5" fill="#79818b">loads in every project</text>

  <rect class="card" x="335" y="350" width="240" height="76" rx="10" fill="#8b949e" fill-opacity=".10" stroke="#8b949e" stroke-opacity=".55"/>
  <text class="h" x="355" y="375" font-size="13" font-weight="600" fill="#6e7681">Keep — project</text>
  <text class="a mono" x="355" y="393" font-size="11" fill="#3b82f6">.claude/skills</text>
  <text class="m" x="355" y="410" font-size="10.5" fill="#79818b">travels with the repo</text>

  <rect class="card" x="610" y="350" width="240" height="76" rx="10" fill="#8b949e" fill-opacity=".10" stroke="#8b949e" stroke-opacity=".55"/>
  <text class="h" x="630" y="375" font-size="13" font-weight="600" fill="#6e7681">Share — team</text>
  <text class="a mono" x="630" y="393" font-size="11" fill="#3b82f6">pull request</text>
  <text class="m" x="630" y="410" font-size="10.5" fill="#79818b">reviewed, merged, everyone gets it</text>

  <!-- ── band 4: the receipt, and the loop back ──────────────────────────── -->

  <rect class="al" x="60" y="442" width="790" height="34" rx="10" fill="none" stroke="#3b82f6" stroke-opacity=".5" stroke-dasharray="5 4"/>
  <text class="h" x="455" y="464" font-size="12" font-weight="500" text-anchor="middle" fill="#6e7681">every skill carries its receipt — the quoted words, the failing command, the fix, the score</text>

  <path class="ln" d="M760 476 V504 H34 V95 H52" fill="none" stroke="#79818b" stroke-width="1.5" stroke-opacity=".8" marker-end="url(#ar)"/>
  <text class="m" x="740" y="497" font-size="10.5" text-anchor="end" fill="#79818b">the next session starts with it already loaded</text>
</svg>
