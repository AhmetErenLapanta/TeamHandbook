<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490"
     role="img" aria-labelledby="t d"
     font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">How the team handbook reaches everyone</title>
  <desc id="d">A skill, an MCP server, or a slash command that is already set up on your machine
    reaches the team repository by one route: you pick it, and everything you picked travels
    together in a single merge request. Picking it is the approval, so there is no second verdict
    to give; the one thing that does not start here is a skill TeamHandbook proposed out of a
    session, which waits for your verdict in /handbook:review. Somebody on the team reviews the
    request and merges it. That repository is a Claude Code plugin marketplace, and the same merge
    raises the plugin version, which is Claude Code's signal that the plugin moved. Every
    teammate's next session refreshes on that version and reports what landed, with nothing
    installed or configured by hand.</desc>

  <!-- No <style> element and no prefers-color-scheme query here, deliberately. GitHub's page theme
       is chosen in the site's own settings, while an SVG loaded through <img> resolves
       prefers-color-scheme against the browser instead, so the two disagree for anyone reading a
       dark page on a light-preference machine: that combination is what made an earlier revision
       look like a light-theme image pasted onto a dark page. One neutral palette, no theme query,
       so there is nothing to get out of step.

       Contrast is measured against the backdrop the text actually sits on - the card fill
       composited over the page - not against the bare page, which flatters it by about 0.2.
       #77797d measures 4.16:1 on the light card and 4.10:1 on the dark one (4.36 and 4.34 for the
       few labels that sit directly on the page). That is near the best a single colour can do
       across both backgrounds, and it is BELOW the 4.5:1 AA threshold for normal-size text.
       WCAG's large-text exemption begins at 18px, or 14px bold, and nothing here qualifies for it,
       so this is a measured shortfall rather than a pass. Two earlier mistakes are worth not
       repeating: the card fill was .12, which pulls both backdrops toward mid-grey and cost about
       0.35 of that ratio, and every secondary label carried fill-opacity=".85", where the same
       colour measures 2.95:1 and 3.18:1. Neither is here now; hierarchy is size and weight only.

       #818790 draws every rule and arrowhead: 3.46:1 and 4.94:1, clearing the 3:1 that WCAG 1.4.11
       asks of a meaningful graphic. The accent #2f81f7 is a stroke and never text, measured at
       3.58:1 and 4.77:1 on the same basis. -->

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0.5 L8.5 4.5 L0 8.5 Z" fill="#818790"/>
    </marker>
  </defs>

  <!-- ── what is already on your machine ─────────────────────────────────── -->

  <text x="32" y="26" font-size="13" font-weight="600" fill="#77797d">Already set up on your machine</text>

  <rect x="32" y="38" width="268" height="88" rx="10" fill="#8b949e" fill-opacity=".05" stroke="#818790"/>
  <text x="52" y="65" font-size="14.5" font-weight="600" fill="#77797d">A skill</text>
  <text x="52" y="87" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#77797d">~/.claude/skills</text>
  <text x="52" y="107" font-size="11.5" fill="#77797d">written by you, or one you</text>
  <text x="52" y="121" font-size="11.5" fill="#77797d">already kept from a session</text>

  <rect x="306" y="38" width="268" height="88" rx="10" fill="#8b949e" fill-opacity=".05" stroke="#818790"/>
  <text x="326" y="65" font-size="14.5" font-weight="600" fill="#77797d">An MCP server</text>
  <text x="326" y="87" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#77797d">~/.claude.json</text>
  <text x="326" y="107" font-size="11.5" fill="#77797d">the one you already have</text>
  <text x="326" y="121" font-size="11.5" fill="#77797d">connected and working</text>

  <rect x="580" y="38" width="268" height="88" rx="10" fill="#8b949e" fill-opacity=".05" stroke="#818790"/>
  <text x="600" y="65" font-size="14.5" font-weight="600" fill="#77797d">A slash command</text>
  <text x="600" y="87" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#77797d">~/.claude/commands</text>
  <text x="600" y="107" font-size="11.5" fill="#77797d">the one you already type</text>
  <text x="600" y="121" font-size="11.5" fill="#77797d">in your own sessions</text>

  <!-- Three legs drawn alike, and the skill leg no longer carries a gate box in front of the
       bracket. That box drew a split that is gone: a picked skill used to be copied into the
       review queue and stop there, and shareSelection now hands skills, servers and commands
       alike to publishTeamSelection, the single function that opens the request. Picking on the
       share screen IS the approval, which is the invariant the box stood for - nothing reaches
       the team that nobody picked. /handbook:review still holds that line for what the HARVEST
       proposed, because nobody chose those; publishCandidate is that path and it has its own
       drawing, so putting it here would draw it twice and add an inlet the row above ("already
       set up on your machine") does not describe.

       ONE request carrying the whole selection, rather than one per item, is the measured part.
       Each item raises the plugin version, bumpPluginVersion reads that version from a fresh
       clone, and two requests opened before either is merged both claim the same number: git
       merges the identical line without a conflict, so the second one lands with no version of
       its own and refreshes nobody's copy. Picking five skills is that case five times over,
       which is why a skill travels inside the batch rather than beside it. -->
  <path d="M166 126 V180" fill="none" stroke="#818790" stroke-width="1.5"/>
  <path d="M440 126 V180" fill="none" stroke="#818790" stroke-width="1.5"/>
  <path d="M714 126 V180" fill="none" stroke="#818790" stroke-width="1.5"/>
  <path d="M166 180 H714" fill="none" stroke="#818790" stroke-width="1.5"/>
  <path d="M440 180 V224" fill="none" stroke="#818790" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="462" y="200" font-size="12.5" font-weight="600" fill="#77797d">Everything you pick travels together in one request.</text>
  <text x="462" y="216" font-size="11.5" fill="#77797d">Somebody on the team reviews that request and merges it.</text>

  <!-- ── the team repository ─────────────────────────────────────────────── -->

  <rect x="32" y="230" width="816" height="122" rx="10" fill="#8b949e" fill-opacity=".05" stroke="#818790"/>
  <text x="52" y="255" font-size="13.5" font-weight="600" fill="#77797d">The team repository, which is a Claude Code plugin marketplace</text>

  <text x="52" y="282" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#77797d">skills/&lt;name&gt;/</text>
  <text x="52" y="299" font-size="11" fill="#77797d">with every file it carries</text>

  <text x="326" y="282" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#77797d">.mcp.json</text>
  <text x="326" y="299" font-size="11" fill="#77797d">merged in, existing entries kept</text>

  <text x="600" y="282" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#77797d">commands/&lt;name&gt;.md</text>
  <text x="600" y="299" font-size="11" fill="#77797d">found there by convention</text>

  <rect x="52" y="312" width="776" height="26" rx="8" fill="none" stroke="#2f81f7" stroke-dasharray="5 4"/>
  <text x="68" y="329" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#77797d">.claude-plugin/plugin.json</text>
  <text x="276" y="329" font-size="12" font-weight="600" fill="#77797d">the same merge raises the version</text>

  <!-- the version bump is the whole delivery mechanism -->
  <path d="M440 352 V396" fill="none" stroke="#818790" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="462" y="372" font-size="12.5" font-weight="600" fill="#77797d">That version is Claude Code's signal to refresh.</text>
  <text x="462" y="388" font-size="11.5" fill="#77797d">No CI, no access token, nobody needing push rights.</text>

  <!-- ── the arriving side ───────────────────────────────────────────────── -->

  <rect x="32" y="402" width="816" height="82" rx="10" fill="#8b949e" fill-opacity=".05" stroke="#818790"/>
  <text x="52" y="427" font-size="13.5" font-weight="600" fill="#77797d">Every teammate's next session picks it up on its own</text>
  <text x="52" y="450" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#77797d">team-handbook: 2 new skill(s) and 1 new command(s) since your last session: ...</text>
  <text x="52" y="472" font-size="11.5" fill="#77797d">They subscribed once. Nothing is installed by hand, and nothing is deleted if the team drops the plugin.</text>
</svg>
